[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pln-prep"
version = "0.1.0"
description = "Pré-processamento de texto padronizado e orientado a objetos para os trabalhos de PLN"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
nltk = ["nltk"]
spacy = ["spacy"]
sklearn = ["scikit-learn"]
all = ["nltk", "spacy", "scikit-learn"]
dev = ["pytest", "nltk", "spacy", "scikit-learn"]

[tool.setuptools]
packages = ["pln_prep"]
